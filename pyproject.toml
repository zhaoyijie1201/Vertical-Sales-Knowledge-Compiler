[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vskc"
version = "0.1.0"
description = "Vertical Sales Knowledge Compiler: grounded next-best-action recommendations for B2B sales"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "tabulate>=0.9",
    "streamlit>=1.36",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
vskc-web = "vskc.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vskc = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
